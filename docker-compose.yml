services:
  belt-factory:
    build: .
    ports:
      - "8080:3000"
    environment:
      # Accounts are now self-service (players create their own username/password at /); no seeded users.
      - SESSION_SECRET=${SESSION_SECRET:-please-change-this}
      - DATA_DIR=/app/data
    volumes:
      - bf-data:/app/data
    restart: unless-stopped

volumes:
  bf-data:
